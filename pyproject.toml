[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "resolve-ipd-project"
version = "0.1.0"
description = "Causal Survival Inference after Reconstructed IPD using Auxiliary Summary Information"
authors = [{ name = "Jonathan Ma" }]
readme = "README.md"
requires-python = ">=3.9"

dependencies = [
    "numpy",
    "pandas",
    "lifelines",
    "matplotlib",
    "scipy"
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]